services:

  user-service:
    build:
      context: ./services/user-service
    image: k8s-java-lab/user-service:1.0
    ports:
      - "8081:8080"

  order-service:
    build:
      context: ./services/order-service
    image: k8s-java-lab/order-service:1.0
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8080
    depends_on:
      - user-service
