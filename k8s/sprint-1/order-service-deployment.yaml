apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: k8s-java-lab
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: k8s-java-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: order-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: k8s-java-lab

    spec:
      containers:
        - name: order-service
          image: k8s-java-lab/order-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:8080"
